<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kazakhstan Travel - destinations, tours and culture of Kazakhstan">
    <title>Sign Up - Kazakhstan Travel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3" aria-label="Main navigation">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="index.html">Kazakhstan Travel</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto gap-lg-2">
                <li class="nav-item"><a class="nav-link" href="index.html" >Home</a></li><li class="nav-item"><a class="nav-link" href="destinations.html" >Destinations</a></li><li class="nav-item"><a class="nav-link" href="tours.html" >Tours</a></li><li class="nav-item"><a class="nav-link" href="culture.html" >Culture</a></li><li class="nav-item"><a class="nav-link" href="team.html" >About us</a></li><li class="nav-item"><a class="nav-link" href="contact.html">Contacts</a></li>
            <li class="nav-item"><a class="nav-link active fw-semibold" href="register.html" aria-current="page">Sign Up</a></li><li class="nav-item ms-lg-2"><button type="button" id="bg-color-btn" class="btn btn-outline-light btn-sm mt-1 mt-lg-0" aria-label="Change page background color">Change background</button></li>
            </ul>
        </div>
    </div>
</nav>
<main class="flex-grow-1">
<div class="container py-4 py-lg-5">
    <div class="row justify-content-center">
        <section class="col-12 col-md-10 col-lg-6" aria-labelledby="register-title">
            <div class="bg-white rounded-3 shadow-sm p-4">
                <h1 id="register-title" class="h3 fw-bold mb-4">Create an Account</h1>
                <form id="register-form" novalidate>
                    <div class="mb-3">
                        <label for="reg-name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="reg-name" placeholder="Enter your full name" autocomplete="name">
                        <div class="invalid-feedback" id="reg-name-error"></div>
                    </div>
                    <div class="mb-3">
                        <label for="reg-email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="reg-email" placeholder="name@example.com" autocomplete="email">
                        <div class="invalid-feedback" id="reg-email-error"></div>
                    </div>
                    <div class="mb-3">
                        <label for="reg-password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="reg-password" placeholder="At least 8 characters" autocomplete="new-password">
                        <div class="invalid-feedback" id="reg-password-error"></div>
                    </div>
                    <div class="mb-3">
                        <label for="reg-confirm" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="reg-confirm" placeholder="Repeat your password" autocomplete="new-password">
                        <div class="invalid-feedback" id="reg-confirm-error"></div>
                    </div>
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="reg-terms">
                        <label class="form-check-label" for="reg-terms">I agree to the terms and conditions</label>
                        <div class="invalid-feedback" id="reg-terms-error"></div>
                    </div>
                    <div id="register-success" class="alert alert-success d-none" role="status">Account created successfully!</div>
                    <div class="btn-group w-100" role="group" aria-label="Form actions">
                        <button type="submit" class="btn btn-primary btn-lg">Sign Up</button>
                        <button type="reset" class="btn btn-outline-secondary btn-lg">Clear</button>
                    </div>
                </form>
            </div>
        </section>
    </div>
</div>
</main>
<footer class="bg-dark text-white text-center py-3 mt-auto">
    <p class="mb-0 small">Project Team: Abylay Maksutov, Rauan Aimakhan, Bolatbek Nurahmet</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/validation.js"></script>
<script src="js/background.js"></script>
</body>
</html>
